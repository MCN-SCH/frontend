name: Telegram notification

on:
  pull_request:
    branches: [ main ]

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Telegram Notify
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: html
          message: |
            <b>🚀 Pull Request Notification</b>
            -----------------------------------

            <b>Repository:</b> ${{ github.repository }}
            <b>PR Number:</b> #${{ github.event.pull_request.number }}
            <b>Title:</b> ${{ github.event.pull_request.title }}
            <b>Author:</b> ${{ github.event.pull_request.user.login }}
            <b>Branch:</b> ${{ github.event.pull_request.head.ref }} → ${{ github.event.pull_request.base.ref }}
            <b>Status:</b> ${{ github.event.pull_request.state }}

            <b>Created At:</b> ${{ github.event.pull_request.created_at }}
            <b>Last Updated:</b> ${{ github.event.pull_request.updated_at }}

            <b>Commits in PR:</b> ${{ github.event.pull_request.commits }}

            <b>View PR:</b>
            <a href="${{ github.event.pull_request.html_url }}">Open Pull Request</a>
